plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version "$mdg_version"
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "$mod_version+$minecraft_version"
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("src/generated/**/.cache")
}

repositories {
}

base {
    archivesName = mod_id
}

java {
    withSourcesJar()

    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_min_version        : neo_min_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' 
}

tasks.withType(Jar).configureEach {
    archiveBaseName = "${mod_id}-neoforge"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = "${mod_group_id}"
            artifactId = "${project.mod_id}"
            version ="${project.version}"

            from components.java
        }
    }

    repositories {
        String mavenType = isDevelopmentVersion() ? "MAVEN_PRIVATE_URL" : "MAVEN_PUBLIC_URL"
        maven {
            url = uri(project.findProperty(mavenType).toString() ?: "")
            credentials {
                username project.findProperty("MAVEN_USERNAME").toString() ?: ""
                password project.findProperty("MAVEN_PASSWORD").toString() ?: ""
            }
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

def isDevelopmentVersion() {
    def versionString = version.toString()
    return versionString.contains("dev")
}
